<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photos — NailOS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap');

:root {
  --bg: #14171a;
  --surface: #1b1f23;
  --surface-2: #20252a;
  --border: #2a2f34;
  --text: #ececea;
  --text-muted: #868d93;
  --accent: #57e8c4;
  --accent-2: #ff8a5b;
  --mono: 'IBM Plex Mono', monospace;
  --sans: 'Inter', sans-serif;
  --display: 'Space Grotesk', sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100vh;
  background-color: var(--bg);
  background-image:
    linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
  background-size: 40px 40px;
  color: var(--text);
  font-family: var(--sans);
  overflow-x: hidden;
}

a { color: inherit; text-decoration: none; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

header {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  flex-wrap: wrap;
  gap: 1rem;
  align-items: center;
  justify-content: space-between;
  padding: 1.1rem 2rem;
  background: rgba(20,23,26,0.82);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}

.brand {
  display: inline-flex;
  align-items: center;
  font-family: var(--display);
  font-weight: 600;
  font-size: 1.05rem;
  letter-spacing: -0.01em;
}

.logo-icon {
  width: 64px;
  height: 64px;
  margin-right: 10px;
  object-fit: contain;
  border-radius: 4px;
  flex: none;
}

nav { display: flex; gap: 0.4rem; flex-wrap: wrap; }

.ws {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  font-family: var(--mono);
  font-size: 0.8rem;
  color: var(--text-muted);
  padding: 0.4rem 0.7rem;
  border-radius: 6px;
  border: 1px solid transparent;
  transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease, transform 0.15s ease;
}
.ws em { font-style: normal; opacity: 0.55; }
.ws:hover { color: var(--text); border-color: var(--border); transform: translateY(-1px); }
.ws.active { color: var(--bg); background: var(--accent); }
.ws.active em { color: var(--bg); opacity: 0.7; }

main {
  position: relative;
  max-width: 1100px;
  margin: 0 auto;
  padding: clamp(3rem, 8vw, 5rem) 1.5rem 6rem;
}

.hero { position: relative; margin-bottom: 3rem; }

.glow {
  position: absolute;
  top: -80px;
  left: -80px;
  width: 380px;
  height: 380px;
  background:
    radial-gradient(circle at 30% 30%, rgba(87,232,196,0.32), transparent 60%),
    radial-gradient(circle at 70% 70%, rgba(255,138,91,0.24), transparent 60%);
  filter: blur(60px);
  z-index: -1;
  pointer-events: none;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 0.55rem;
  font-family: var(--mono);
  font-size: 0.76rem;
  color: var(--text-muted);
  border: 1px solid var(--border);
  background: var(--surface);
  padding: 0.4rem 0.8rem;
  border-radius: 999px;
  margin-bottom: 1.5rem;
  opacity: 0;
  animation: rise 0.5s ease both;
}
.badge .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 3px rgba(87,232,196,0.15);
}

h1 {
  font-family: var(--display);
  font-weight: 600;
  font-size: clamp(2.2rem, 5vw, 3.2rem);
  letter-spacing: -0.02em;
  margin: 0 0 0.8rem;
  opacity: 0;
  animation: rise 0.55s 0.08s ease both;
}

.lede {
  color: var(--text-muted);
  font-size: 1.05rem;
  line-height: 1.6;
  max-width: 60ch;
  margin: 0;
  opacity: 0;
  animation: rise 0.55s 0.16s ease both;
}

@keyframes rise {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.seccion-titulo {
  font-family: var(--display);
  font-size: 1.3rem;
  color: var(--text);
  margin-top: 3.5rem;
  margin-bottom: 1.5rem;
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.seccion-titulo::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* Grilla de imágenes estilo Galería */
.galeria-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 1.5rem;
}

.card-foto {
  position: relative;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid var(--border);
  background: var(--surface);
  transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
  cursor: pointer;
}

.card-foto:hover {
  transform: translateY(-4px);
  border-color: var(--accent);
  box-shadow: 0 12px 28px rgba(0,0,0,0.4);
}

.card-foto img {
  width: 100%;
  height: 220px;
  object-fit: cover;
  display: block;
}

.card-foto .info {
  padding: 0.75rem 1rem;
  font-family: var(--mono);
  font-size: 0.78rem;
  color: var(--text-muted);
  background: var(--surface-2);
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-top: 1px solid var(--border);
}

/* Modal visor de imagen */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(10, 12, 14, 0.9);
  backdrop-filter: blur(8px);
  justify-content: center;
  align-items: center;
  padding: 2rem;
}

.modal img {
  max-width: 90vw;
  max-height: 85vh;
  border-radius: 12px;
  border: 1px solid var(--border);
  box-shadow: 0 20px 50px rgba(0,0,0,0.6);
}

footer {
  text-align: center;
  padding: 2rem;
  font-family: var(--mono);
  font-size: 0.78rem;
  color: var(--text-muted);
  border-top: 1px solid var(--border);
}

@media (max-width: 600px) {
  .galeria-grid { grid-template-columns: 1fr; }
  header { padding: 1rem; }
  .ws em { display: none; }
}
</style>
</head>
<body>

<header>
  <div class="brand"><img src="icon/icon.png" alt="NailOS" class="logo-icon" width="22" height="22">nailos</div>
  <nav aria-label="Páginas">
    <a href="index.html" class="ws"><em>1</em>Inicio</a>
    <a href="about.html" class="ws"><em>2</em>About</a>
    <a href="photos.html" class="ws active"><em>3</em>Photos</a>
    <a href="descarga.html" class="ws"><em>4</em>Descarga</a>
    <a href="equipo.html" class="ws"><em>5</em>Equipo</a>
  </nav>
</header>

<main>
  <div class="hero">
    <div class="glow"></div>
    <div class="badge"><span class="dot"></span>media</div>
    <h1>Galeria de Fotos</h1>
    <p class="lede">Capturas de pantalla del entorno de escritorio Hyprland y la colección oficial de fondos de pantalla de NailOS.</p>
  </div>

  <!-- SECCIONES DE GALERÍA -->
  <div id="sec-screenshots" style="display:none;">
    <h2 class="seccion-titulo">Capturas del Sistema</h2>
    <div id="galeria-screenshots" class="galeria-grid"></div>
  </div>

  <div id="sec-wallpapers" style="display:none;">
    <h2 class="seccion-titulo">Wallpapers Oficiales</h2>
    <div id="galeria-wallpapers" class="galeria-grid"></div>
  </div>
</main>

<!-- MODAL VISOR -->
<div id="modal-visor" class="modal" onclick="cerrarModal()">
  <img id="img-ampliada" src="" alt="Vista ampliada">
</div>

<footer>nailos — proyecto en desarrollo desde septiembre de 2026</footer>

<script>
// Carga automática secuencial desde imagenes/
async function cargarGaleria(prefix, contenedorId, seccionId, etiquetaText) {
  const contenedor = document.getElementById(contenedorId);
  const seccion = document.getElementById(seccionId);
  let index = 1;
  let count = 0;

  while (index <= 50) {
    const ruta = `imagenes/${prefix}${index}.png`;
    const existe = await comprobarExisteImagen(ruta);

    if (existe) {
      const card = document.createElement('div');
      card.className = 'card-foto';
      card.onclick = () => abrirModal(ruta);

      card.innerHTML = `
        <img src="${ruta}" alt="${prefix} ${index}" loading="lazy">
        <div class="info">
          <span>${etiquetaText} #${index}</span>
          <span style="color: var(--accent);">Ampliar ↗</span>
        </div>
      `;

      contenedor.appendChild(card);
      count++;
      index++;
    } else {
      break;
    }
  }

  if (count > 0) {
    seccion.style.display = 'block';
  }
}

function comprobarExisteImagen(url) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve(true);
    img.onerror = () => resolve(false);
    img.src = url;
  });
}

// Funciones del Visor Modal
function abrirModal(src) {
  document.getElementById('img-ampliada').src = src;
  document.getElementById('modal-visor').style.display = 'flex';
}

function cerrarModal() {
  document.getElementById('modal-visor').style.display = 'none';
}

window.addEventListener('DOMContentLoaded', () => {
  cargarGaleria('screen', 'galeria-screenshots', 'sec-screenshots', 'Screenshot');
  cargarGaleria('wallpaper', 'galeria-wallpapers', 'sec-wallpapers', 'Wallpaper');
});
</script>

</body>
</html>
